# Builds tagged releases on GitHub, uploads assets, and creates artifact attestations
# (Obsidian review bot expects attestations on main.js / styles.css).
# Local workflow: bump versions, run ./release.sh (commit + tag + push only).

name: Release

on:
  push:
    tags:
      # Glob (fnmatch), not regex — semver tags like 2.1.5
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js styles.css manifest.json \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
